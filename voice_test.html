<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chirp3-HD 음색 비교 · MP3 저장</title>
<!-- 바로가기 / 즐겨찾기 아이콘 (같은 폴더에 아이콘 파일들이 있어야 함) -->
<link rel="icon" href="mic.svg" type="image/svg+xml">
<link rel="icon" href="mic32.png" sizes="32x32">
<link rel="apple-touch-icon" href="mic180.png">
<meta name="theme-color" content="#556b2f">
<style>
  /* 올리브 계열 — 배경은 밝은 올리브, 내용 상자는 어두운 올리브 */
  body { font-family: -apple-system, "Malgun Gothic", sans-serif;
         background:#556b2f; color:#f2f2e6; margin:0; padding:16px; }
  h1 { font-size:20px; margin:0 0 14px; color:#ffffff; }
  .box { background:#2b3714; border:1px solid #6d8a3c; border-radius:8px;
         padding:12px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:#c9d6a8; margin:8px 0 3px; }
  input[type=text], input[type=password], textarea, select {
    width:100%; box-sizing:border-box; padding:7px 9px; border:1px solid #6d8a3c;
    border-radius:5px; background:#1d2610; color:#f2f2e6; font-size:14px; }
  table { border-collapse:collapse; width:100%; font-size:14px;
          background:#2b3714; border-radius:8px; overflow:hidden; }
  th, td { border-bottom:1px solid #46592a; padding:6px 5px; text-align:left; }
  th { background:#1d2610; position:sticky; top:0; font-size:12px; color:#c9d6a8; }
  button { cursor:pointer; border:none; border-radius:5px; padding:5px 10px;
           background:#46592a; color:#f2f2e6; font-size:13px; }
  button:hover { background:#5d7538; }
  button.heard { background:#2d6a4f; }
  .mode { background:#1d2610; border:1px solid #6d8a3c; border-radius:7px;
          padding:4px; display:inline-flex; gap:4px; }
  .mode button { padding:7px 14px; font-size:13px; background:transparent;
                 border:none; color:#c9d6a8; }
  .mode button.on { background:#8fbc3f; color:#1d2610; font-weight:bold; }
  button.plen { background:#1d2610; border:1px solid #46592a; font-size:12px; padding:5px 9px; }
  button.plen.on { background:#8fbc3f; border-color:#8fbc3f; color:#1d2610; font-weight:bold; }
  button.preset { background:#1d2610; border:1px solid #46592a; font-size:12px; padding:5px 9px; }
  button.preset.on { background:#8fbc3f; border-color:#8fbc3f; color:#1d2610; font-weight:bold; }
  .name { white-space:nowrap; }
  .f { color:#f5c0d5; } .m { color:#a8d8ff; }
  .memo { width:100%; box-sizing:border-box; padding:4px 6px; border:1px solid #46592a;
          border-radius:4px; background:#1d2610; color:#f2f2e6; font-size:13px; }
  #status { font-size:14px; color:#f2f2e6; min-height:22px; margin:10px 0;
            padding:8px 10px; background:#2b3714; border-left:3px solid #8fbc3f;
            border-radius:4px; }
  .hint { font-size:12px; color:#bccb98; margin-top:6px; line-height:1.5; }
  #rateVal { color:#ffe08a; }
</style>
</head>
<body>

<h1>Chirp3-HD 음색 비교 · MP3 저장</h1>

<div class="box">
  <label>Google Cloud API 키</label>
  <input type="password" id="key" placeholder="AIza...">
  <label>1. 낭독체</label><input type="text" id="s0">
  <label>2. 설교체</label><input type="text" id="s1">
  <label>3. 대화체</label><input type="text" id="s2">
  <label>4. 감정표현</label><input type="text" id="s3">
</div>

<div class="box">
  <div style="font-size:13px;color:#c9d6a8;margin-bottom:6px">
    맨 아래 <b style="color:#ffffff">음색 비교 표</b>에서 칸(▶)을 누르면 이렇게 동작합니다
  </div>
  <div class="mode">
    <button id="mPlay" class="on">▶ 그 자리에서 듣기</button>
    <button id="mSave">💾 그 한 개만 저장</button>
  </div>
  <label>읽는 속도 <span style="color:#bccb98">(비교 표와 본문 MP3 모두에 적용)</span></label>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
    <button id="rDown" style="font-size:18px;padding:6px 16px">−</button>
    <span id="rateVal" style="min-width:64px;text-align:center;font-size:20px;
          font-weight:bold;color:#f0c060">1.00</span>
    <button id="rUp" style="font-size:18px;padding:6px 16px">＋</button>
    <span style="color:#bccb98;font-size:12px">배</span>
  </div>
  <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
    <button class="preset" data-r="0.85">느리게 0.85</button>
    <button class="preset" data-r="0.90">낭독 0.90</button>
    <button class="preset" data-r="1.00">보통 1.00</button>
    <button class="preset" data-r="1.10">설교 1.10</button>
    <button class="preset" data-r="1.25">빠르게 1.25</button>
  </div>
  <input type="hidden" id="rate" value="1">
  <label style="display:flex;gap:7px;align-items:center;cursor:pointer;margin-top:10px">
    <input type="checkbox" id="fixVerse" checked style="accent-color:#8fbc3f">
    <span>성경 장절 표기 자동 변환 (요10:10 → 요한복음 십 장 십 절)</span>
  </label>
  <div class="hint" id="hint"></div>
</div>

<div class="box">
  <div style="font-size:15px;font-weight:bold;margin-bottom:4px">본문으로 MP3 만들기</div>
  <div class="hint">긴 본문을 넣으면 문장 단위로 잘라 합성한 뒤 MP3 한 개로 이어 붙여 저장합니다. 미리 듣기는 앞 한두 문장만 들려주므로 음색과 속도를 빠르게 비교하실 수 있습니다.</div>
  <label>음색</label>
  <select id="tVoice"></select>
  <label>본문 (길이 제한 없음)</label>
  <textarea id="tText" rows="8" style="line-height:1.6;resize:vertical" placeholder="여기에 설교 원고나 성경 본문을 붙여 넣으세요."></textarea>
  <label>파일명 (확장자 없이)</label>
  <input type="text" id="tName" placeholder="genesis01">  <label>미리 듣기 길이</label>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="plen" data-n="1">1문장</button>
    <button class="plen" data-n="2">2문장</button>
    <button class="plen" data-n="4">4문장</button>
  </div>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
    <button id="tPlay" style="font-size:16px;padding:10px 20px;background:#8fbc3f;color:#1d2610">▶ 앞부분 미리 듣기</button>
    <button id="tStop" style="font-size:16px;padding:10px 16px">■ 정지</button>
    <button id="tSave" style="font-size:16px;padding:10px 20px;background:#8a6d1f">💾 MP3 저장</button>
  </div>
  <div class="hint" id="tInfo"></div>
</div>

<div id="status"></div>

<div style="font-size:15px;font-weight:bold;margin:18px 0 6px">음색 비교 표 <span style="font-size:13px;font-weight:normal;color:#bccb98">— ▶ 를 누르면 그 음색·문체로 들려줍니다</span></div>
<table>
  <thead><tr>
    <th>음색</th><th>낭독</th><th>설교</th><th>대화</th><th>감정</th><th>메모</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>

<script>
const VOICES = [
  ["Achernar","f"],["Aoede","f"],["Autonoe","f"],["Callirrhoe","f"],["Despina","f"],
  ["Erinome","f"],["Gacrux","f"],["Kore","f"],["Laomedeia","f"],["Leda","f"],
  ["Pulcherrima","f"],["Sulafat","f"],["Vindemiatrix","f"],["Zephyr","f"],
  ["Achird","m"],["Algenib","m"],["Algieba","m"],["Alnilam","m"],["Charon","m"],
  ["Enceladus","m"],["Fenrir","m"],["Iapetus","m"],["Orus","m"],["Puck","m"],
  ["Rasalgethi","m"],["Sadachbia","m"],["Sadaltager","m"],["Schedar","m"],
  ["Umbriel","m"],["Zubenelgenubi","m"]
];
const DEFAULTS = [
  "태초에 하나님이 천지를 창조하시니라.",
  "여러분, 은혜는 값이 없습니다. 그러나 값싸지 않습니다.",
  "그런데 말이죠, 우리가 정말 그렇게 살고 있나요?",
  "주님, 제가 또 넘어졌습니다."
];
const LABELS = ["낭독","설교","대화","감정"];
const cache = new Map();
// localStorage가 막힌 환경(file://, 시크릿 모드 등)에서도 죽지 않도록
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let player = null;
let bodyBlob = null;    // 이어붙인 MP3 (저장용)
let bodyChunks = null;  // 조각별 음원 (미리듣기용)
let stopFlag = false;
let previewChunk = null;  // 미리듣기용 음원
let previewLen = 1;       // 미리듣기 문장 수
let saveMode = false;

// --- 입력값 저장/복원 ---
const keyEl = document.getElementById("key");
keyEl.value = LS.get("tts_key") || "";
keyEl.onchange = () => LS.set("tts_key", keyEl.value.trim());
DEFAULTS.forEach((d, i) => {
  const el = document.getElementById("s" + i);
  el.value = LS.get("tts_s" + i) || d;
  el.onchange = () => { LS.set("tts_s" + i, el.value); cache.clear(); };
});

// --- 동작 모드 전환 ---
const mPlay = document.getElementById("mPlay");
const mSave = document.getElementById("mSave");
const hint = document.getElementById("hint");
function setMode(save) {
  saveMode = save;
  mPlay.classList.toggle("on", !save);
  mSave.classList.toggle("on", save);
  hint.textContent = save
    ? "저장 모드입니다. 칸을 누르면 그 한 개만 MP3로 내려받습니다. 이미 들어 본 칸은 API를 다시 쓰지 않습니다."
    : "듣기 모드입니다. 칸을 누르면 그 음색·문체로 합성해 재생합니다. 한 번 들은 것은 다시 누르면 즉시 재생됩니다.";
}
mPlay.onclick = () => setMode(false);
mSave.onclick = () => setMode(true);
setMode(false);

// --- 표 만들기 ---
const tbody = document.getElementById("rows");
VOICES.forEach(([name, g]) => {
  const tr = document.createElement("tr");
  let html = `<td class="name ${g}">${name}<br><span style="font-size:11px;color:#bccb98">${g === "f" ? "여성" : "남성"}</span></td>`;
  for (let i = 0; i < 4; i++) html += `<td><button data-v="${name}" data-i="${i}">▶</button></td>`;
  html += `<td><input class="memo" data-v="${name}" placeholder="메모"></td>`;
  tr.innerHTML = html;
  tbody.appendChild(tr);
});

document.querySelectorAll(".memo").forEach(el => {
  const k = "tts_memo_" + el.dataset.v;
  el.value = LS.get(k) || "";
  el.onchange = () => LS.set(k, el.value);
});

const status = document.getElementById("status");

async function synth(voice, idx) {
  const ck = voice + "|" + idx + "|" + getRate() + "|" + (fixEl.checked ? 1 : 0);
  if (cache.has(ck)) return cache.get(ck);
  const key = keyEl.value.trim();
  if (!key) throw new Error("API 키를 먼저 입력하세요.");
  const text = document.getElementById("s" + idx).value.trim();
  if (!text) throw new Error("샘플 문장이 비어 있습니다.");

  const res = await fetch(
    "https://texttospeech.googleapis.com/v1/text:synthesize?key=" + encodeURIComponent(key),
    { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        input: { text: prep(text) },
        voice: { languageCode: "ko-KR", name: "ko-KR-Chirp3-HD-" + voice },
        audioConfig: { audioEncoding: "MP3", speakingRate: getRate() }
      })
    });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error((e.error && e.error.message) || ("HTTP " + res.status));
  }
  const data = await res.json();
  const url = "data:audio/mp3;base64," + data.audioContent;
  cache.set(ck, url);
  return url;
}

function download(dataUrl, filename) {
  const bin = atob(dataUrl.split(",")[1]);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bytes], { type: "audio/mpeg" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// 재생을 "시작"만 하고 돌아온다. 끝날 때까지 기다리지 않는다.
function startPlay(url, onEnd) {
  return new Promise((resolve, reject) => {
    if (player) { player.pause(); }
    player = new Audio(url);
    let started = false;
    player.oncanplay = () => { started = true; };
    player.onended = () => { if (onEnd) onEnd(); };
    player.onerror = () => reject(new Error("이 오디오를 재생할 수 없습니다."));
    player.play().then(() => resolve()).catch(err => {
      if (err && err.name === "NotAllowedError")
        reject(new Error("브라우저가 자동 재생을 막았습니다. 버튼을 한 번 더 눌러 주세요."));
      else reject(err);
    });
    // 5초 안에 재생 준비가 안 되면 알려 준다
    setTimeout(() => {
      if (!started && player && player.readyState === 0)
        status.textContent = "⚠ 오디오를 읽지 못하는 것 같습니다. 다시 눌러 보세요.";
    }, 5000);
  });
}

// 끝날 때까지 기다리는 형태 (표에서 한 칸씩 들을 때 사용)
function play(url) {
  return new Promise((resolve, reject) => {
    startPlay(url, resolve).catch(reject);
  });
}

// ===== 성경 장절 표기 → 읽는 말로 변환 =====
const BOOKS = {
  "창":"창세기","출":"출애굽기","레":"레위기","민":"민수기","신":"신명기",
  "수":"여호수아","삿":"사사기","룻":"룻기","삼상":"사무엘상","삼하":"사무엘하",
  "왕상":"열왕기상","왕하":"열왕기하","대상":"역대상","대하":"역대하",
  "스":"에스라","느":"느헤미야","에":"에스더","욥":"욥기","시":"시편",
  "잠":"잠언","전":"전도서","아":"아가","사":"이사야","렘":"예레미야",
  "애":"예레미야애가","겔":"에스겔","단":"다니엘","호":"호세아","욜":"요엘",
  "암":"아모스","옵":"오바댜","욘":"요나","미":"미가","나":"나훔",
  "합":"하박국","습":"스바냐","학":"학개","슥":"스가랴","말":"말라기",
  "마":"마태복음","막":"마가복음","눅":"누가복음","요":"요한복음","행":"사도행전",
  "롬":"로마서","고전":"고린도전서","고후":"고린도후서","갈":"갈라디아서",
  "엡":"에베소서","빌":"빌립보서","골":"골로새서","살전":"데살로니가전서",
  "살후":"데살로니가후서","딤전":"디모데전서","딤후":"디모데후서","딛":"디도서",
  "몬":"빌레몬서","히":"히브리서","약":"야고보서","벧전":"베드로전서",
  "벧후":"베드로후서","요일":"요한일서","요이":"요한이서","요삼":"요한삼서",
  "유":"유다서","계":"요한계시록"
};

// 숫자를 한자어 읽기로 (1~999)
function sino(n) {
  n = Number(n);
  if (!n) return "";
  const D = ["","일","이","삼","사","오","육","칠","팔","구"];
  let s = "";
  const b = Math.floor(n / 100), t = Math.floor((n % 100) / 10), o = n % 10;
  if (b) s += (b > 1 ? D[b] : "") + "백";
  if (t) s += (t > 1 ? D[t] : "") + "십";
  if (o) s += D[o];
  return s;
}

// 약자는 긴 것부터 (삼상 > 삼, 요일 > 요)
const ABBR = Object.keys(BOOKS).sort((a, b) => b.length - a.length);
const FULL = Object.values(BOOKS).sort((a, b) => b.length - a.length);
const NAMES = [...FULL, ...ABBR].join("|");
const toFull = k => BOOKS[k] || k;

function fixVerseForTTS(text) {
  let t = text;

  // 요10:10 / 요 10:10 / 요한복음 10:10-12 / 요10장10절
  t = t.replace(
    new RegExp("(" + NAMES + ")\\s*(\\d{1,3})\\s*(?::|장\\s*)\\s*(\\d{1,3})(?:\\s*절)?(?:\\s*[-~–]\\s*(\\d{1,3})(?:\\s*절)?)?", "g"),
    (m, bk, ch, v1, v2) => {
      const name = toFull(bk);
      const unit = name === "시편" ? " 편 " : " 장 ";   // 시편은 '편'으로 읽는다
      let s = name + " " + sino(ch) + unit + sino(v1) + " 절";
      if (v2) s += "부터 " + sino(v2) + " 절까지";
      return s;
    });

  // 시편 23편 / 시 23편
  t = t.replace(
    new RegExp("(" + NAMES + ")\\s*(\\d{1,3})\\s*편", "g"),
    (m, bk, ch) => toFull(bk) + " " + sino(ch) + " 편");

  // 창세기 1장 (절 없이)
  t = t.replace(
    new RegExp("(" + NAMES + ")\\s*(\\d{1,3})\\s*장", "g"),
    (m, bk, ch) => toFull(bk) + " " + sino(ch) + " 장");

  // 장절 없이 남은 약자 뒤 숫자만 있는 경우: 요 10 → 요한복음 십
  return t;
}

// ===== 읽는 속도 =====
const rateEl = document.getElementById("rate");
const rateVal = document.getElementById("rateVal");
const fixEl = document.getElementById("fixVerse");
rateEl.value = LS.get("tts_rate") || "1";
fixEl.checked = LS.get("tts_fix") !== "0";

function setRate(v) {
  v = Math.min(1.6, Math.max(0.5, Math.round(v * 100) / 100));
  rateEl.value = String(v);
  rateVal.textContent = v.toFixed(2);
  LS.set("tts_rate", rateEl.value);
  cache.clear();        // 속도가 바뀌면 캐시 무효
  bodyBlob = null; bodyChunks = null; previewChunk = null;
  document.querySelectorAll("button.preset").forEach(b =>
    b.classList.toggle("on", Math.abs(Number(b.dataset.r) - v) < 0.001));
  document.querySelectorAll("td button.heard").forEach(b => b.classList.remove("heard"));
}
setRate(Number(rateEl.value));

document.getElementById("rDown").onclick = () => setRate(Number(rateEl.value) - 0.05);
document.getElementById("rUp").onclick = () => setRate(Number(rateEl.value) + 0.05);
document.querySelectorAll("button.preset").forEach(b =>
  b.onclick = () => setRate(Number(b.dataset.r)));

fixEl.onchange = () => {
  LS.set("tts_fix", fixEl.checked ? "1" : "0");
  cache.clear();
  bodyBlob = null; bodyChunks = null; previewChunk = null;
  showLen();
};
const getRate = () => Number(rateEl.value);
const prep = s => fixEl.checked ? fixVerseForTTS(s) : s;

// 본문을 문장 단위로 (미리듣기용)
function sentences(raw) {
  return raw.replace(/\s+/g, " ").trim()
    .split(/(?<=[.!?…]|다\.|요\.|까\?)\s+/).filter(x => x.trim());
}

// ===== 본문으로 MP3 만들기 =====
const tVoice = document.getElementById("tVoice");
const tText = document.getElementById("tText");
const tName = document.getElementById("tName");
const tInfo = document.getElementById("tInfo");

VOICES.forEach(([n, g]) => {
  const o = document.createElement("option");
  o.value = n;
  o.textContent = n + (g === "f" ? " (여성)" : " (남성)");
  tVoice.appendChild(o);
});
tVoice.value = LS.get("tts_tvoice") || "Charon";
tVoice.onchange = () => LS.set("tts_tvoice", tVoice.value);
tText.value = LS.get("tts_ttext") || "";
tText.oninput = () => { LS.set("tts_ttext", tText.value); showLen(); };
tName.value = LS.get("tts_tname") || "";
tName.onchange = () => LS.set("tts_tname", tName.value.trim());

const bytes = s => new TextEncoder().encode(s).length;
function showLen() {
  const n = tText.value.trim().length;
  if (!n) { tInfo.textContent = ""; return; }
  let s = `${n}자 · 약 ${splitText(tText.value).length}개 조각으로 나뉩니다.`;
  const conv = prep(tText.value.trim());
  if (fixEl.checked && conv !== tText.value.trim()) {
    s += "\n변환 결과 : " + conv.slice(0, 140) + (conv.length > 140 ? " ..." : "");
  }
  tInfo.style.whiteSpace = "pre-wrap";
  tInfo.textContent = s;
}
showLen();

// 문장 끝에서 자르고, 조각당 1200바이트 이하로 묶음 (API 한도 5000바이트)
function splitText(raw) {
  const sents = raw.replace(/\s+/g, " ").trim()
    .split(/(?<=[.!?…]|다\.|요\.|까\?)\s+/).filter(s => s.trim());
  const out = [];
  let buf = "";
  for (let s of sents) {
    // 한 문장이 너무 길면 쉼표에서 더 쪼갠다
    if (bytes(s) > 1200) {
      for (const p of s.split(/(?<=,)\s+/)) {
        if (bytes(buf + " " + p) > 1200 && buf) { out.push(buf.trim()); buf = ""; }
        buf += " " + p;
      }
      continue;
    }
    if (bytes(buf + " " + s) > 1200 && buf) { out.push(buf.trim()); buf = ""; }
    buf += " " + s;
  }
  if (buf.trim()) out.push(buf.trim());
  return out;
}

async function synthRaw(voice, text) {
  const key = keyEl.value.trim();
  if (!key) throw new Error("API 키를 먼저 입력하세요.");
  const res = await fetch(
    "https://texttospeech.googleapis.com/v1/text:synthesize?key=" + encodeURIComponent(key),
    { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        input: { text: prep(text) },
        voice: { languageCode: "ko-KR", name: "ko-KR-Chirp3-HD-" + voice },
        audioConfig: { audioEncoding: "MP3", speakingRate: getRate() }
      })
    });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error((e.error && e.error.message) || ("HTTP " + res.status));
  }
  const data = await res.json();
  const bin = atob(data.audioContent);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}


// 실패하면 잠깐 쉬고 다시 시도 (일시적 네트워크 오류 대비)
async function synthRetry(voice, text, tries = 3) {
  for (let k = 1; ; k++) {
    try { return await synthRaw(voice, text); }
    catch (err) {
      const msg = String(err.message || "");
      const retryable = /HTTP 5|429|Failed to fetch|NetworkError|network/i.test(msg);
      if (k >= tries || !retryable) throw err;
      await new Promise(r => setTimeout(r, 800 * k));   // 0.8초, 1.6초 대기
    }
  }
}

const CONCURRENCY = 3;   // 동시에 보낼 요청 수 (Chirp3 분당 한도 200에 한참 못 미침)

async function buildBody() {
  const parts = splitText(tText.value);
  if (!parts.length) throw new Error("본문이 비어 있습니다.");

  const chunks = new Array(parts.length);
  const todo = parts.map((_, i) => i).filter(i => !chunks[i]);
  let done = parts.length - todo.length;
  let next = 0;

  status.textContent = `합성 중 ${done} / ${parts.length} ...`;

  // 일꾼 3명이 남은 조각을 하나씩 집어 간다 (순서는 번호로 지킨다)
  async function worker() {
    while (true) {
      const at = next++;
      if (at >= todo.length) return;
      const i = todo[at];
      chunks[i] = await synthRetry(tVoice.value, parts[i]);
      done++;
      status.textContent = `합성 중 ${done} / ${parts.length} ...`;
    }
  }
  await Promise.all(
    Array.from({ length: Math.min(CONCURRENCY, todo.length) }, worker));

  bodyChunks = chunks;
  bodyBlob = new Blob(chunks, { type: "audio/mpeg" });
  const mb = (bodyBlob.size / 1048576).toFixed(2);
  status.textContent = `완성 : 조각 ${parts.length}개, ${mb} MB`;
  return bodyBlob;
}

// 미리 듣기 길이 버튼
document.querySelectorAll("button.plen").forEach(b => {
  b.onclick = () => {
    previewLen = Number(b.dataset.n);
    LS.set("tts_plen", String(previewLen));
    previewChunk = null;                 // 길이가 바뀌면 다시 합성
    document.querySelectorAll("button.plen").forEach(x =>
      x.classList.toggle("on", Number(x.dataset.n) === previewLen));
  };
});
previewLen = Number(LS.get("tts_plen") || 1);
document.querySelectorAll("button.plen").forEach(x =>
  x.classList.toggle("on", Number(x.dataset.n) === previewLen));

document.getElementById("tPlay").onclick = async function () {
  const btn = this, label = "▶ 앞부분 미리 듣기";
  btn.disabled = true;
  stopFlag = false;
  try {
    const sents = sentences(tText.value);
    if (!sents.length) throw new Error("본문이 비어 있습니다.");
    const sample = sents.slice(0, previewLen).join(" ");
    if (!previewChunk) {
      btn.textContent = "⏳ 합성 중...";
      status.textContent = `앞 ${previewLen}문장 합성 중...`;
      previewChunk = await synthRaw(tVoice.value, sample);
    }
    btn.disabled = false;
    btn.textContent = label;
    const url = URL.createObjectURL(new Blob([previewChunk], { type: "audio/mpeg" }));
    status.textContent = `▶ 재생 중 · ${tVoice.value} · ${Number(rateEl.value).toFixed(2)}배 · 앞 ${previewLen}문장`;
    await startPlay(url, () => {
      URL.revokeObjectURL(url);
      status.textContent = "미리 듣기 완료 — 음색·속도를 바꿔 다시 들어 보거나, MP3 저장을 누르세요";
    });
  } catch (err) {
    status.textContent = "오류: " + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
};

document.getElementById("tStop").onclick = () => {
  stopFlag = true;
  if (player) { player.pause(); player.currentTime = 0; }
  status.textContent = "정지";
};

document.getElementById("tSave").onclick = async function () {
  const label = this.textContent;
  this.disabled = true;
  this.textContent = "⏳ 만드는 중...";
  try {
    const blob = bodyBlob || await buildBody();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (tName.value.trim() || tVoice.value) + ".mp3";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    status.textContent = "✅ 저장 완료 : " + a.download + "  (다운로드 폴더를 확인하세요)";
    // 끝난 것이 확실히 보이도록 버튼을 잠깐 초록으로
    this.textContent = "✅ 저장 완료";
    this.style.background = "#2d6a4f";
    setTimeout(() => { this.textContent = label; this.style.background = "#8a6d1f"; }, 2500);
    return;
  } catch (err) {
    status.textContent = "오류: " + err.message;
  } finally { this.disabled = false; }
  this.textContent = label;
};

// 본문이나 음색이 바뀌면 이전 결과는 버린다
tText.addEventListener("input", () => { bodyBlob = null; bodyChunks = null; previewChunk = null; });
tVoice.addEventListener("change", () => { bodyBlob = null; bodyChunks = null; previewChunk = null; });

// ===== 음색 비교 표 =====
document.addEventListener("click", async e => {
  const btn = e.target.closest("button[data-v]");
  if (!btn) return;
  const voice = btn.dataset.v;
  const i = Number(btn.dataset.i);
  btn.disabled = true;
  try {
    if (saveMode) {
      status.textContent = `${voice} — ${LABELS[i]}체 준비 중...`;
      const url = await synth(voice, i);
      download(url, `${voice}_${LABELS[i]}.mp3`);
      status.textContent = `저장 완료 : ${voice}_${LABELS[i]}.mp3`;
    } else {
      status.textContent = `${voice} — ${LABELS[i]}체 준비 중...`;
      const url = await synth(voice, i);
      status.textContent = `${voice} — ${LABELS[i]}체 재생 중`;
      await play(url);
      btn.classList.add("heard");
      status.textContent = `${voice} — ${LABELS[i]}체 재생 완료`;
    }
  } catch (err) {
    status.textContent = "오류: " + err.message;
  } finally {
    btn.disabled = false;
  }
});
